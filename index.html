<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Wattpad Button</title>
  <style>
    @import url('https://googleapis.com');

    /* Reset default browser spacing and center everything on the screen */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0d11; /* Dark background to make the neon glow pop */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Prevents unwanted scrollbars */
    }

    /* Unique Premium Button Design */
    .unique-wattpad-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 56px;
      
      /* Glowing Sunset Gradient */
      background: linear-gradient(135deg, #FF4500 0%, #FF8C00 100%);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 50px; /* Capsule shape */
      
      /* Huge Literary Typography */
      font-family: 'Cinzel', Georgia, serif;
      font-size: 40px; 
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      
      /* Outer neon glow and inner gloss highlight */
      box-shadow: 0 10px 40px rgba(255, 69, 0, 0.45), 
                  inset 0 2px 4px rgba(255, 255, 255, 0.3);
      
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    /* Smooth element transition for the book emoji */
    .unique-wattpad-btn .emoji {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* Hover States: Floating elevation, intense glow, and tilting emoji */
    .unique-wattpad-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(255, 69, 0, 0.65), 
                  inset 0 2px 4px rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #FF5714 0%, #FFA014 100%);
    }

    .unique-wattpad-btn:hover .emoji {
      transform: scale(1.2) rotate(-12deg);
    }

    /* Realistic click/press effect */
    .unique-wattpad-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 69, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- The Centered Button Element with the updated URL -->
  <a href="https://www.wattpad.com/1660448010-the-last-room" target="_blank" rel="noopener noreferrer" class="unique-wattpad-btn">
    <span class="emoji">📖</span>
    <span class="text">Read on Wattpad</span>
  </a>

</body>
</html>
